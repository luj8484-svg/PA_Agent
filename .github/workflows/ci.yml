name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate isolated research runtime
        run: python -m pa_agent.research_cli validate-environment

      - name: Run research test suites
        run: |
          pytest tests/research_cli -q
          pytest tests/research_data -q
          pytest tests/research_backtest -q

      - name: Validate 2B test registry
        run: python scripts/validate_2b_test_registry.py

      - name: Static checks
        run: |
          ruff check pa_agent/research_backtest tests/research_backtest
          ruff format --check pa_agent/research_backtest tests/research_backtest
          python -m compileall -q pa_agent
